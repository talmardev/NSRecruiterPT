[project]
name = "nsrecruiter"
version = "0.1.0"
description = "Cliente de recrutamento para a Telegrams API do NationStates"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
nsrecruiter = "nsrecruiter.cli:main"
ns-recruiter-web = "nsrecruiter.web.comando:principal"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"nsrecruiter.web" = ["static/*.html", "static/*.css", "static/*.js", "static/vendor/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
